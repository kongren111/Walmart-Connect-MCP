<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Walmart 本地广告分析仪表盘</title>
  <style>
    :root {
      --bg: #f6f8fb; --card: #ffffff; --ink: #1e293b; --muted: #64748b;
      --line: #e2e8f0; --brand: #0071dc; --brand2: #ffc220;
      --good: #16a34a; --bad: #dc2626; --warn: #d97706;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--ink); }
    header { background: linear-gradient(90deg, var(--brand), #1d4ed8); color: #fff; padding: 18px 26px; }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; font-size: 13px; opacity: .9; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 26px 60px; }
    .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: var(--card);
      border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; }
    .bar label { font-size: 13px; color: var(--muted); }
    .bar input[type=number] { width: 76px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; }
    .btn { background: var(--brand); color: #fff; border: 0; border-radius: 8px; padding: 8px 14px;
      font-size: 13px; cursor: pointer; }
    .btn.ghost { background: #eef2ff; color: var(--brand); }
    .btn:hover { filter: brightness(1.05); }
    .drop { border: 2px dashed var(--line); border-radius: 12px; padding: 22px; text-align: center; color: var(--muted);
      background: #fff; cursor: pointer; margin-bottom: 16px; }
    .drop.hover { border-color: var(--brand); background: #f0f7ff; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .kpi .v { font-size: 22px; font-weight: 700; }
    .kpi .l { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .kpi .s { font-size: 11px; margin-top: 4px; }
    .s.good { color: var(--good); } .s.bad { color: var(--bad); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 18px; }
    .card h2 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
    .card h2 .tag { font-size: 11px; background: #eef2ff; color: var(--brand); padding: 2px 8px; border-radius: 999px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr:hover td { background: #f8fafc; }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; }
    .pill.good { background: #dcfce7; color: var(--good); }
    .pill.bad { background: #fee2e2; color: var(--bad); }
    .pill.warn { background: #fef3c7; color: var(--warn); }
    .pill.neu { background: #e2e8f0; color: #475569; }
    .chart { width: 100%; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
    .empty { color: var(--muted); text-align: center; padding: 30px; }
    .status { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .status b { color: var(--ink); }
    .actions { display: flex; gap: 10px; margin-top: 8px; }
    .warnbox { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; border-radius: 8px;
      padding: 8px 12px; font-size: 12px; margin-bottom: 12px; }
    .scoren { font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <h1>🛒 Walmart 本地广告分析仪表盘</h1>
    <p>纯本地运行 · 上传你的 Walmart 后台广告报告（CSV / Excel）即可分析 · 数据不上传任何服务器</p>
  </header>
  <div class="wrap">
    <div class="bar">
      <label>目标 ROAS <input id="targetRoas" type="number" step="0.5" value="3" /></label>
      <label>高效阈值 <input id="highRoas" type="number" step="0.5" value="5" /></label>
      <label>低效阈值 <input id="lowRoas" type="number" step="0.5" value="2" /></label>
      <button class="btn ghost" id="loadSample">加载示例数据</button>
      <button class="btn" id="exportSkill">⬇ 导出优化 Skill</button>
    </div>

    <div class="drop" id="drop">
      <div>把 Walmart 广告报告文件拖到这里，或 <b>点击选择</b>（支持多选：活动/广告组/关键词/搜索词/Placement/Platform/每日表现 等 CSV 或 Excel）</div>
      <input id="file" type="file" accept=".csv,.xlsx,.xls" multiple hidden />
    </div>
    <div class="status" id="status">尚未加载数据。可点击「加载示例数据」体验。</div>
    <div id="warn"></div>

    <div class="kpis" id="kpis"></div>

    <div class="card">
      <h2>📈 趋势与时段 <span class="tag" id="trendTag"></span></h2>
      <div class="grid2">
        <div><div class="chart" id="trendSpend"></div></div>
        <div><div class="chart" id="trendRoas"></div></div>
      </div>
      <div id="trendNote" class="status"></div>
    </div>

    <div class="grid2">
      <div class="card">
        <h2>🏆 活动效率排名 <span class="tag">按花费</span></h2>
        <div class="chart" id="campaignBar"></div>
      </div>
      <div class="card">
        <h2>📊 广告组效率排名 <span class="tag">Top</span></h2>
        <div class="chart" id="adGroupBar"></div>
      </div>
    </div>

    <div class="card">
      <h2>🎯 关键词分析</h2>
      <div id="kwZero" class="status"></div>
      <div id="kwTable"></div>
    </div>

    <div class="grid2">
      <div class="card">
        <h2>📐 Placement 溢价建议</h2>
        <div id="placementTable"></div>
      </div>
      <div class="card">
        <h2>📱 Platform 溢价建议</h2>
        <div id="platformTable"></div>
      </div>
    </div>

    <div class="card">
      <h2>💡 预算与自动竞价建议</h2>
      <div id="budgetTable"></div>
    </div>

    <div class="card">
      <h2>✅ 优化建议汇总</h2>
      <div id="summary" class="status"></div>
    </div>
  </div>

  <script src="./vendor/xlsx.full.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
